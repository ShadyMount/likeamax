name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    check:
        name: Проверки проекта
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Загрузить исходники
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Настроить Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24.x'
                  cache: npm

            - name: Установить зависимости из lock-файла
              run: npm ci

            - name: Установить Chromium и системные зависимости
              run: npx playwright install --with-deps chromium

            - name: Проверить код, архитектуру, форматирование, тесты и сборку
              run: npm run check
